<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo King UI</title>
<link rel="stylesheet" href="ludo.css">
</head>
<body>

<div class="topbar">
  <div class="profile">👤</div>

  <div class="currency">💎 150+</div>
  <div class="currency">🪙 8715+</div>
</div>

<div class="center">

  <div class="logo">
    <h1>LUDO KING</h1>
    <div class="dice">🎲</div>
  </div>

  <div class="menu-grid">

    <div class="card">🌍<br>ONLINE</div>

    <div class="card">⚔️<br>TEAM UP</div>

    <div class="card">❤️<br>FRIENDS</div>

    <div class="card">📱<br>COMPUTER</div>

    <div class="card">👥<br>PASS N PLAY</div>

  </div>

  <div class="tournament">
    🏆 TOURNAMENT
  </div>

</div>

<div class="bottom">

  <div class="nav-item active">
    🏠
    <span>HOME</span>
  </div>

  <div class="nav-item">
    📅
    <span>EVENT</span>
  </div>

  <div class="nav-item">
    🎤
    <span>ADDA</span>
  </div>

  <div class="nav-item">
    🎒
    <span>INVENTORY</span>
  </div>

  <div class="nav-item">
    💬
    <span>SOCIAL</span>
  </div>

</div>

<script src="ludo.js"></script>

</body>
</html>
